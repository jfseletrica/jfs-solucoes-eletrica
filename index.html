<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#080b10,#121a24);color:#fff;display:flex;justify-content:center;padding:28px 16px}
.card{width:100%;max-width:460px;text-align:center;padding:28px 22px 24px;border:1px solid rgba(40,157,255,.25);border-radius:28px;background:rgba(13,18,25,.94);box-shadow:0 18px 60px rgba(0,0,0,.45)}
.logo{width:155px;height:155px;object-fit:cover;border-radius:50%;background:#fff;border:3px solid rgba(24,145,235,.65);box-shadow:0 0 30px rgba(24,145,235,.22)}
h1{font-size:25px;margin:18px 0 6px;letter-spacing:.4px}
.sub{margin:0 0 25px;color:#b9c3cf;font-size:14px}
.btn{display:block;text-decoration:none;color:#fff;font-weight:700;padding:17px 18px;margin:12px 0;border-radius:14px;background:linear-gradient(135deg,#087cf0,#1557c8);box-shadow:0 8px 22px rgba(9,112,235,.22);transition:.2s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.secondary{background:#151e29;border:1px solid #263b51;box-shadow:none}
.icon{font-size:19px;margin-right:8px}
.divider{height:1px;background:#23303d;margin:26px 0 18px}
.footer{font-size:12px;color:#758494}
.badge{display:inline-block;margin-bottom:10px;padding:6px 10px;border-radius:99px;border:1px solid #1d5f92;color:#72bfff;font-size:11px;font-weight:700;letter-spacing:.7px}
</style>
